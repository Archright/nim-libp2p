# Customer-side BYO-Agent workflow — Phase 4 acceptance deployment.
#
# Repository: Archright/nim-libp2p (org fork of the Nim subject — simulates
# the customer environment; the SUBJECT under verification is the upstream
# iftech/nim-libp2p @ the pinned commit).
# Contract: docs/spec/byo_agent_proposition_contract.md (Archright/Axiom)
#
# A8 honest note: Job 1 emits a PINNED propositions document (authored by a
# real LLM in the 2026-11-02 E2E; source recorded in
# docs/evidence/byo_agent_phase3_selftest_deps_fix_2026-11-03.md §5 and the
# bytesview acceptance doc). No live LLM runs in this CI — "BYO real-agent
# in-CI execution" is NOT claimed by this deployment.
#
# Modes (workflow_dispatch input):
#   main     — pinned propositions → prove → upstream report (expected: exit 1
#              DISPROVED, report → DUPLICATE #3364, workflow green)
#   empty    — propositions: [] (expected: NO_PROPOSALS exit 3 — prove job
#              FAILS, fail-closed, no issue)
#   mismatch — subject.commit disagrees with the workflow env (expected:
#              SUBJECT_MISMATCH exit 3 — prove job FAILS, no issue)

name: 'Axiom BYO-Agent verification'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'main | empty | mismatch'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - empty
          - mismatch

jobs:
  agent:
    name: 'Job 1 — customer agent: emit propositions artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 'Emit pinned propositions document (mode-aware)'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/byoa"
          case "$MODE" in
            main)
              cat > "${RUNNER_TEMP}/byoa/proposals.json" <<'JSON'
              {"schema_version":1,"subject":{"repository":"iftech/nim-libp2p","commit":"a130a7f32219909bdcda14b7f1e64d0804fc832c"},"agent":{"id":"phase3-selftest-agent","version":"1.0"},"propositions":[{"specId":"SPEC-LIBP2P-BV-SLICE","target":"libp2p/utils/bytesview.nim::toOpenArray","source_location":{"file":"libp2p/utils/bytesview.nim","line":18},"explanation":"Phase 4 fork deployment — pinned BYO proposition (LLM-authored, 2026-11-02 E2E)"}]}
              JSON
              ;;
            empty)
              cat > "${RUNNER_TEMP}/byoa/proposals.json" <<'JSON'
              {"schema_version":1,"subject":{"repository":"iftech/nim-libp2p","commit":"a130a7f32219909bdcda14b7f1e64d0804fc832c"},"agent":{"id":"phase3-selftest-agent","version":"1.0"},"propositions":[]}
              JSON
              ;;
            mismatch)
              # A manipulated subject claim: disagrees with the workflow env
              # (AXIOM_SUBJECT_COMMIT) — must be rejected (§5, exit 3).
              cat > "${RUNNER_TEMP}/byoa/proposals.json" <<'JSON'
              {"schema_version":1,"subject":{"repository":"iftech/nim-libp2p","commit":"0000000000000000000000000000000000000001"},"agent":{"id":"phase3-selftest-agent","version":"1.0"},"propositions":[{"specId":"SPEC-LIBP2P-BV-SLICE","target":"libp2p/utils/bytesview.nim::toOpenArray","source_location":{"file":"libp2p/utils/bytesview.nim","line":18},"explanation":"Phase 4 negative test — manipulated subject commit"}]}
              JSON
              ;;
            *)
              echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          python3 -m json.tool "${RUNNER_TEMP}/byoa/proposals.json" >/dev/null

      - name: 'Upload proposals artifact (Job-1 boundary — data only, §9)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'byoa-fork-proposals'
          path: '${{ runner.temp }}/byoa/proposals.json'
          if-no-files-found: error

  axiom:
    name: 'Job 2 — Axiom verify + upstream report (reusable workflow)'
    needs: agent
    uses: Archright/Axiom/.github/workflows/byo-agent.yml@dd31ca68ec2aa55762ff5de3b70605f960a565a7
    permissions:
      contents: read
      issues: write
    with:
      proposal-artifact: 'byoa-fork-proposals'
      subject-repository: 'iftech/nim-libp2p'
      subject-commit: 'a130a7f32219909bdcda14b7f1e64d0804fc832c'
      axiom-ref: 'dd31ca68ec2aa55762ff5de3b70605f960a565a7'
      proposals-path: 'proposals.json'
      dry-run: ${{ inputs.mode != 'main' }}
    secrets:
      AXIOM_READ_TOKEN: ${{ secrets.AXIOM_READ_TOKEN }}
      SUBJECT_REPORT_TOKEN: ${{ secrets.SUBJECT_REPORT_TOKEN }}
